services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: signfix
      MYSQL_USER: signfix
      MYSQL_PASSWORD: signfix_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports: ["3306:3306"]
    volumes:
      - signfix_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  signfix_mysql:
